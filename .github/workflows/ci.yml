name: ci

# The gate IS the deliverable in this project: a differentiator nobody can falsify is
# not a differentiator. Every job below is a machine-checked invariant, and every gate
# has a self-test with a planted violation that must fail (AGENTS.md section 14).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gates + typecheck + tests
    # Path separators, FTS5 collation and case handling are the two places this repo
    # has historically differed between platforms, so both are exercised (Story 6
    # edge case: "CI running on Windows vs Linux path separators").
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      # G-4 runs gitleaks as a SUBPROCESS (`bun run ci` -> runGitleaks), not as an action, so
      # the binary has to be on PATH before `bun run ci` or the gate fails closed on every run
      # and reports a red build for a reason that is purely environmental. The `secrets` job
      # below uses the action and scans git HISTORY; this step installs the binary so the
      # working-TREE scan actually executes here. Both are needed, and neither covers the other.
      #
      # A composite action rather than inline shell, because the `evidence` job below also runs
      # `bun run ci` (inside `ci:clean-clone`) and would otherwise carry its own copy of this
      # download pinned to its own version. One install, one pin, one place to audit.
      - name: Install gitleaks (G-4 subprocess gate needs the binary, not the action)
        uses: ./.github/actions/setup-gitleaks

      - name: Assert the corpus is reproducible and licence-attested
        # Fails closed on a hash or record-count drift. Skips cleanly when the corpus
        # has not been ingested yet, because the DB is gitignored by design and the
        # attestation + committed registry are what CI audits.
        run: bun run ingest:check

      - name: Assert the docs only claim what the code and the registry support
        # The disclosure drift class: a file path, an env var or a licence class that the
        # documentation asserts and the repository does not contain. See
        # packages/mizan-gate/src/docs-claims.ts for the four rules.
        run: bun run check:docs

      - name: Assert the run chain is intact (the badge's own audit trail)
        # `verify:ledger` checks the CORPUS chain. This checks the RUN chain - every committed entry
        # recording whether each run happened the way its trace says. Nothing invoked this audit
        # before, so the chain that backs the central claim had no command a judge could run.
        # The count is deliberately absent: `data/runs.jsonl` is appended to by the demo suite, so
        # a number printed here would be stale before the next release - the exact
        # "the claim is asserted, not computed" defect this repository exists to argue against.
        run: bun run verify:runs

      - name: Typecheck, tests and structural gates (G-1..G-7)
        run: bun run ci

      - name: Print the typecheck/test/gate summary
        if: always()
        run: bun run ci -- --report-only

  # The corpus lanes. This job exists because of the CR's Finding 1, and its shape is the finding.
  #
  # `bun run ci` is corpus-free by design (AGENTS.md section 8, and the reason `scripts/ci-lanes.ts`
  # exists at all), so the two opt-in lanes are the only place the published benchmark and the real
  # acceptance table are ever executed. Before this job, nothing automated ran them: the tests were
  # collected by nobody, which is a guard that cannot fail in a different way from one that is not
  # there. `scripts/ci-lanes.test.ts` now asserts that every lane in the table is invoked here.
  #
  # It is a separate job, not more steps in `gate`, for one reason: `bun run ingest` reaches the
  # network and takes minutes. Folding a third party's uptime into the hermetic gate would mean a
  # red build whose cause is upstream, and a gate people learn to re-run is not a gate
  # (`scripts/ingest.ts` says the same thing about `ingest:check`).
  #
  # `ci:clean-clone` runs `bun run ci` internally — that is what "the whole acceptance table, for
  # real" means — so gitleaks is installed here too.
  evidence:
    name: corpus lanes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Both runners, not one. These lanes measure the same snapshot the benchmark report was
        # published against, and R10 in the customer spec is explicit that anything touching a
        # measurement is gated on both legs: win32 and ubuntu differ on path handling and FTS5
        # collation, which is exactly what `ci:corpus` would silently absorb.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Install gitleaks (G-4 subprocess gate needs the binary, not the action)
        uses: ./.github/actions/setup-gitleaks

      - name: Build the snapshot the corpus lanes measure
        # Fails loud, and the failure names the source rather than the benchmark that could not
        # run. A truncated or partial ingest is the one outcome the lanes must not accept, so
        # `--limit` and `--allow-partial` are absent here deliberately.
        run: bun run ingest

      - name: The published benchmark, measured against the real corpus
        run: bun run ci:corpus

      - name: The acceptance table, run for real on this checkout
        run: bun run ci:clean-clone

      - name: The customer acceptance command itself
        # `ci:clean-clone` runs the table inside `bun test`; this runs the operator's own command
        # and asserts its exit code, which is the contract the spec publishes (0 accepted,
        # 1 a check failed, 2 could not start). The two are not the same claim: one is the table's
        # behaviour and one is the process exit a script depends on.
        run: bun run accept:customer

  secrets:
    name: gitleaks over git history (G-4's second half)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scans git HISTORY, which the G-4 subprocess gate cannot: it runs `detect --no-git`
      # over the working tree. A key that was committed and then removed is invisible to the
      # tree scan and obvious to this one, so both halves are required and neither is a
      # substitute for the other. A planted secret fails this job. `.env*` is gitignored, and
      # no credential is present in the golden or red-team fixtures.
      - name: Detect leaked secrets in commit history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ledger:
    name: provenance chain
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A judge runs exactly this. It must exit 0 on an intact chain and name the
      # exact broken entry index otherwise (R11).
      - name: Verify the append-only hash chain
        run: bun run verify:ledger
